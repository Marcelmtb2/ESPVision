[project]
name = "fast-zero"
version = "0.1.0"

description = ""
authors = [
    {name = "Marcelmtb2",email = "mtb2@softex.cin.ufpe.br"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.12,<0.116.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pillow (>=11.2.1,<12.0.0)",
    "sse-starlette (>=2.3.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
taskipy = "^1.14.1"
ruff = "^0.11.4"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]

lint = 'ruff check'
pre_format = 'ruff check --fix '
format = 'ruff check --fix && ruff format'
run = 'fastapi dev fast_zero/app.py'
runesp = 'fastapi dev main.py --reload --host 0.0.0.0 --port 8000'
runesp32 = "uvicorn main:app --reload --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5"

pre_test = 'task lint'
test = 'pytest -s -x --cov=fast_zero -vv'
post_test = 'coverage html'

